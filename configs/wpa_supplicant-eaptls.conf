# ============================================================
#  SWFE837 – wpa_supplicant.conf pour EAP-TLS (TP2)
#  Authentification certificat client sur WPA3-Enterprise
# ============================================================
# Usage : sudo wpa_supplicant -i wlan0 -c wpa_supplicant-eaptls.conf -d

ctrl_interface=/tmp/wpa_client_ok
update_config=1

network={
    ssid="SWFE837-WPA3-Enterprise"
    key_mgmt=WPA-EAP-SHA256
    eap=TLS
    identity="etudiant1"
    ca_cert="/opt/swfe837/certs/ca.pem"
    client_cert="/opt/swfe837/certs/client.pem"
    private_key="/opt/swfe837/certs/client.key"
    private_key_passwd="labo2026"
    pairwise=CCMP
    group=CCMP
    # ieee80211w=2  <-- désactivé pour compatibilité simulateur
}
