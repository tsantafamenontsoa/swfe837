# ============================================================
#  SWFE837 – Configuration hostapd WPA3-Enterprise (TP2)
#  IEEE 802.11i / EAP-TLS avec serveur RADIUS FreeRADIUS
# ============================================================

# Interface réseau Wi-Fi (adapter selon votre setup : wlan1, wlan2...)
interface=wlan1

# Pilote (nl80211 pour la quasi-totalité des cartes modernes)
driver=nl80211

# ── Paramètres du réseau ──────────────────────────────────────
ssid=SWFE837-WPA3-Enterprise
channel=6
hw_mode=g           # g = 2,4 GHz   |   a = 5 GHz
ieee80211n=1        # Activer 802.11n (HT)
ieee80211w=2        # 802.11w requis (PMF) – obligatoire pour WPA3

# ── Sécurité WPA3-Enterprise ──────────────────────────────────
# wpa=2 → WPA2/WPA3 (compatible)   |   wpa=3 → WPA3 uniquement
wpa=2
wpa_key_mgmt=WPA-EAP-SHA256     # EAP avec SHA-256 (WPA3-Enterprise)
rsn_pairwise=CCMP               # Chiffrement CCMP (AES)

# ── Authentification 802.1X / EAP-TLS ────────────────────────
ieee8021x=1
eap_server=0                    # 0 = déléguer au RADIUS externe

# Paramètres du serveur RADIUS
auth_server_addr=127.0.0.1      # FreeRADIUS en local
auth_server_port=1812
auth_server_shared_secret=labo_secret_2026

# Optionnel : RADIUS d'accounting
#acct_server_addr=127.0.0.1
#acct_server_port=1813
#acct_server_shared_secret=labo_secret_2026

# ── Logging ──────────────────────────────────────────────────
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2
