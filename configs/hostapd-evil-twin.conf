# ============================================================
#  SWFE837 – Configuration hostapd Evil Twin (TP3)
#  AP malveillant SANS chiffrement (Open) – Usage labo uniquement
# ============================================================
# ⚠ AVERTISSEMENT : Ce fichier est exclusivement destiné à
#   un environnement de laboratoire isolé. Son utilisation
#   en dehors du cadre pédagogique est illégale.
# ============================================================

interface=wlan2
driver=nl80211

# SSID identique à l'AP légitime (objectif du TP)
ssid=NexelliaWifi

channel=6
hw_mode=g
ieee80211n=1

# Réseau ouvert – pas de chiffrement (pour démontrer la menace)
wpa=2
wpa_passphrase=labo2026
wpa_key_mgmt=WPA-PSK

# Plage DHCP gérée par dnsmasq (lancé séparément)
# Voir : dnsmasq-evil-twin.conf

# ── Logging ──────────────────────────────────────────────────
logger_stdout=-1
logger_stdout_level=2
