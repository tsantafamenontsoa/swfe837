# ============================================================
#  SWFE837 – FreeRADIUS eap.conf (TP2)
#  Configuration du module EAP-TLS
# ============================================================

eap {
    default_eap_type = tls
    timer_expire     = 60
    ignore_unknown_eap_types = no
    cisco_accounting_username_bug = no
    max_sessions = 4096

    tls-config tls-common {
        private_key_password   = labo2026
        private_key_file       = /opt/swfe837/certs/server.key
        certificate_file       = /opt/swfe837/certs/server.pem
        ca_file                = /opt/swfe837/certs/ca.pem
        dh_file                = /opt/swfe837/certs/dh2048.pem   # généré par install_labo.sh
        random_file            = /dev/urandom
        fragment_size          = 1024
        include_length         = yes
        check_crl              = no
        cipher_list            = "HIGH"
        tls_min_version        = "1.2"
        tls_max_version        = "1.3"
    }

    tls {
        tls = tls-common
    }
}
